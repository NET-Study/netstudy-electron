name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installer to
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Attach installer to release
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          gh release upload "$TAG" "dist/NET-Study-Setup-1.0.0-x64.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NET-Study-Setup-x64
          path: dist/NET-Study-Setup-1.0.0-x64.exe
          if-no-files-found: error
